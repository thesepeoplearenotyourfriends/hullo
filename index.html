<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hullo</title><link rel="stylesheet" href="hullo.css">
<main>
  <header><h1>Hullo</h1><button id="console" class="quiet" disabled title="Local Eruda is not present in this checkout">Console</button></header>
  <section id="landing">
    <p>An ephemeral, two-peer demonstration. Nothing here becomes a browser identity or conversation history.</p>
    <label class="loopback"><input type="checkbox" id="loopback"> Same-device LOOPBACK TEST</label>
    <button id="create">Create invitation</button><output id="invite"></output>
  </section>
  <section hidden id="session">
    <details id="startup" open><summary><span id="state">invitation accepted</span></summary><ol id="stages" aria-live="polite"></ol></details>
    <div id="messages" aria-live="polite"></div>
    <form id="composer"><textarea id="payload" placeholder="Message" aria-label="Message"></textarea><button id="send" type="submit">Send</button></form>
  </section>
</main>
<script type="module" src="../web_cockpit/peer-core.js"></script><script type="module" src="browser-host.js"></script>
